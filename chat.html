<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI সহকারী — আল হামরা নূরানী মাদ্রাসা</title>
<meta name="description" content="আল হামরা নূরানী মাদ্রাসা, ধানুয়াখালী — AI সহকারী">
<meta name="theme-color" content="#0f3d2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<script src="chat-config.js"></script>
<style>
:root{--deep:#0f3d2e;--green:#1b5e42;--gold:#c9a227;--cream:#f4f8f5;--soft:#e7efe8;--ink:#202820;--muted:#657067;--line:#dbe5de;--red:#a6402f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;top:0;left:0;right:0;height:var(--app-h,100dvh);font-family:"Hind Siliguri",system-ui,sans-serif;background:var(--cream);color:var(--ink);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.head{background:linear-gradient(135deg,var(--deep),var(--green));color:#fff;border-bottom:3px solid var(--gold);padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;flex:none}
.head a.back{color:#fff;text-decoration:none;font-size:1.5rem;width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.head a.back:active{background:rgba(255,255,255,.18)}
.head img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#fff}
.head .t{flex:1;min-width:0;line-height:1.25}
.head .t b{display:block;font-size:1rem;line-height:1.2}
.head .t small{opacity:.85;font-size:.78rem}
.hb .ic{font-size:1.05rem;line-height:1}
.hb{display:inline-flex;align-items:center;gap:5px;border:0;background:rgba(255,255,255,.14);color:#fff;font:inherit;font-size:.82rem;padding:7px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.hb:hover{background:rgba(255,255,255,.26)}
#chat{flex:1;overflow-y:auto;padding:14px 12px 8px;scroll-behavior:smooth}
.wrap{max-width:780px;margin:0 auto}
.welcome{text-align:center;padding:18px 6px 8px}
.welcome img{width:84px;height:84px;border-radius:50%;border:3px solid var(--gold);object-fit:cover;background:#fff;box-shadow:0 8px 22px rgba(15,61,46,.2)}
.welcome h1{margin:12px 0 4px;font-size:1.35rem;color:var(--deep)}
.welcome p{margin:0 0 16px;color:var(--muted)}
.sugs{display:grid;gap:9px;max-width:520px;margin:0 auto}
.sug{font:inherit;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;color:var(--deep);font-weight:500;display:flex;gap:10px;align-items:center;transition:.15s}
.sug:hover,.sug:active{border-color:var(--gold);box-shadow:0 6px 16px rgba(15,61,46,.1);transform:translateY(-1px)}
.row{display:flex;gap:8px;margin:12px 0;align-items:flex-end}
.row.user{flex-direction:row-reverse}
.av{width:32px;height:32px;border-radius:50%;flex:none;object-fit:cover;border:1.5px solid var(--gold);background:#fff}
.bub{max-width:min(82%,620px);padding:10px 14px;border-radius:18px;line-height:1.7;word-wrap:break-word;overflow-wrap:anywhere;font-size:1rem;position:relative}
.bot .bub{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px;box-shadow:0 2px 8px rgba(15,61,46,.06)}
.user .bub{background:linear-gradient(135deg,var(--green),var(--deep));color:#fff;border-bottom-right-radius:5px;white-space:pre-wrap}
.bub.err{background:#fdf0ee;border-color:#e8b9b0;color:var(--red)}
.bub p{margin:0 0 8px}.bub p:last-child{margin:0}
.bub ul,.bub ol{margin:4px 0 8px;padding-left:22px}
.cp{display:inline-flex;align-items:center;gap:4px;margin-top:6px;border:0;background:var(--soft);color:var(--green);font:inherit;font-size:.78rem;padding:3px 10px;border-radius:999px;cursor:pointer}
.cp:hover{background:#d5e6da}
.typing{display:inline-flex;gap:5px;padding:4px 2px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--green);opacity:.35;animation:b 1.2s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-6px);opacity:1}}
.composer{flex:none;background:#fff;border-top:1px solid var(--line);padding:10px 10px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.cin{max-width:780px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;min-width:0;font:inherit;font-size:16px;resize:none;border:1.5px solid var(--line);border-radius:22px;padding:11px 16px;max-height:140px;line-height:1.5;outline:none;background:var(--cream)}
textarea:focus{border-color:var(--green);background:#fff}
#send{width:46px;height:46px;border-radius:50%;border:0;background:var(--green);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none;transition:.15s}
#send:disabled{background:#a9b7ae;cursor:not-allowed}
#send svg{width:22px;height:22px;fill:#fff}
.note{max-width:780px;margin:6px auto 0;text-align:center;font-size:.72rem;color:var(--muted)}
/* বেতন যাচাই ফরম */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;max-width:min(92%,460px);box-shadow:0 2px 8px rgba(15,61,46,.06)}
.card h3{margin:0 0 4px;color:var(--deep);font-size:1.02rem}
.card .sub{margin:0 0 10px;color:var(--muted);font-size:.85rem}
.card label{display:block;font-size:.84rem;font-weight:600;margin:9px 0 3px;color:var(--deep)}
.card input,.card select{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--cream);outline:none}
.card input:focus,.card select:focus{border-color:var(--green);background:#fff}
.card .btn{width:100%;margin-top:12px;padding:11px;border:0;border-radius:10px;background:var(--green);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.card .btn:disabled{background:#a9b7ae}
.card .msg{margin-top:8px;font-size:.88rem;color:var(--red);min-height:1em}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.sum div{background:var(--cream);border-radius:10px;padding:8px 4px;text-align:center}
.sum b{display:block;font-size:.98rem}.sum span{font-size:.7rem;color:var(--muted)}
.sum .d b{color:var(--red)}.sum .p b{color:var(--green)}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}
th{background:var(--soft);color:var(--deep)}td:first-child,th:first-child{text-align:left}
.ok{color:var(--green);font-weight:600}.bad{color:var(--red);font-weight:600}
.scroll{overflow-x:auto}
.offline{display:none;background:var(--red);color:#fff;text-align:center;padding:5px;font-size:.85rem;flex:none}
@media (max-width:560px){
  .head{gap:6px;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top))}
  .head img{width:34px;height:34px}
  .head a.back{width:32px;height:32px;font-size:1.3rem}
  .head .t b{font-size:.92rem}
  .head .t small{font-size:.72rem}
  .hb{width:36px;height:36px;padding:0;justify-content:center;flex:none}
  .hb .lb{display:none}
  #chat{padding:10px 8px 6px}
  .row{margin:9px 0;gap:6px}
  .av{width:28px;height:28px}
  .bub{max-width:calc(100% - 40px);font-size:.97rem;line-height:1.6;padding:9px 12px}
  .welcome{padding:6px 2px 4px}
  .welcome img{width:62px;height:62px}
  .welcome h1{font-size:1.15rem;margin:8px 0 2px}
  .welcome p{font-size:.9rem;margin-bottom:10px}
  .sugs{gap:7px}
  .sug{padding:9px 12px;font-size:.93rem;border-radius:12px}
  .card{max-width:100%}
  .composer{padding:7px 8px;padding-bottom:max(7px,env(safe-area-inset-bottom))}
  #send{width:42px;height:42px}
  textarea{padding:9px 14px}
  .note{font-size:.66rem;margin-top:4px}
}
@media (max-height:560px){.note{display:none}.welcome img{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="head">
  <a class="back" id="back" href="index.html" aria-label="ফিরে যান">←</a>
  <img src="madrasa.jpeg" alt="লোগো">
  <div class="t"><b>আল হামরা নূরানী মাদ্রাসা</b><small>AI সহকারী</small></div>
  <button class="hb" id="newBtn" type="button" aria-label="নতুন চ্যাট" title="নতুন চ্যাট"><span class="ic">＋</span><span class="lb">নতুন চ্যাট</span></button>
  <button class="hb" id="clearBtn" type="button" aria-label="চ্যাট মুছুন" title="চ্যাট মুছুন"><span class="ic">🗑</span><span class="lb">মুছুন</span></button>
</header>
<div class="offline" id="offline">📡 ইন্টারনেট সংযোগ নেই</div>

<main id="chat" aria-live="polite"><div class="wrap" id="wrap"></div></main>

<div class="composer">
  <div class="cin">
    <textarea id="q" rows="1" maxlength="1000" placeholder="আপনার প্রশ্ন লিখুন..." aria-label="প্রশ্ন লিখুন"></textarea>
    <button id="send" type="button" aria-label="পাঠান"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button>
  </div>
  <div class="note"> AI ভুল করতে পারে, গুরুত্বপূর্ণ বিষয় হলে মাদ্রাসায় যোগাযোগ করুন</div>
</div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var wrap=$("wrap"),chat=$("chat"),q=$("q"),sendBtn=$("send");
var CFG=window.ALHAMRA_CHAT||{};
var history=[];      /* শুধু ব্রাউজারের মেমোরিতে; বেতনের তথ্য এখানে রাখা হয় না */
var busy=false;

var SUGS=[
 ["🏫","মাদ্রাসার পরিচিতি জানতে চাই।"],
 ["📝","ভর্তি কীভাবে হতে পারবে?"],
 ["📢","মাদ্রাসার নোটিশ দেখাও।"],
 ["📊","পরীক্ষার ফলাফল কীভাবে দেখব?"],
 ["🕌","ইসলাম সম্পর্কে একটি প্রশ্ন আছে।"],
 ["💰","সন্তানের বেতন ও বকেয়া জানতে চাই।"]
];

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function bn(n){return String(n==null?"":n).replace(/[0-9]/g,function(d){return"০১২৩৪৫৬৭৮৯"[d]})}
function money(n){return "৳"+bn(Number(n||0).toLocaleString("en-US"))}
function scrollDown(){chat.scrollTop=chat.scrollHeight}

/* সাধারণ লেখাকে নিরাপদে সাজানো (আগে escape, তারপর **বোল্ড**, তালিকা, লাইন) */
function fmt(t){
  var lines=esc(t).split(/\n/),out="",list=null;
  function close(){if(list){out+="</"+list+">";list=null}}
  lines.forEach(function(l){
    var b=l.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
    var m=/^\s*[-*•]\s+(.*)/.exec(b),n=/^\s*(\d+|[০-৯]+)[.)]\s+(.*)/.exec(b);
    if(m){if(list!=="ul"){close();out+="<ul>";list="ul"}out+="<li>"+m[1]+"</li>"}
    else if(n){if(list!=="ol"){close();out+="<ol>";list="ol"}out+="<li>"+n[2]+"</li>"}
    else{close();if(b.trim())out+="<p>"+b+"</p>"}
  });
  close();return out||"<p></p>";
}

function row(kind){
  var r=document.createElement("div");r.className="row "+kind;
  if(kind==="bot"){var a=document.createElement("img");a.className="av";a.src="madrasa.jpeg";a.alt="";r.appendChild(a)}
  return r;
}
function addUser(t){
  var r=row("user"),b=document.createElement("div");b.className="bub";b.textContent=t;r.appendChild(b);wrap.appendChild(r);scrollDown();
}
function addBot(t,isErr){
  var r=row("bot"),b=document.createElement("div");b.className="bub"+(isErr?" err":"");
  b.innerHTML=fmt(t);
  if(!isErr){
    var c=document.createElement("button");c.type="button";c.className="cp";c.textContent="📋 কপি";
    c.addEventListener("click",function(){
      var done=function(){c.textContent="✅ কপি হয়েছে";setTimeout(function(){c.textContent="📋 কপি"},1500)};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,fallback);else fallback();
      function fallback(){var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){}ta.remove()}
    });
    b.appendChild(document.createElement("br"));b.appendChild(c);
  }
  r.appendChild(b);wrap.appendChild(r);scrollDown();return r;
}
function addTyping(){
  var r=row("bot"),b=document.createElement("div");b.className="bub";
  b.innerHTML='<span class="typing" aria-label="উত্তর তৈরি হচ্ছে"><i></i><i></i><i></i></span>';
  r.appendChild(b);wrap.appendChild(r);scrollDown();return r;
}

function welcome(){
  wrap.innerHTML="";
  var w=document.createElement("div");w.className="welcome";
  w.innerHTML='<img src="madrasa.jpeg" alt="লোগো"><h1>আসসালামু আলাইকুম! 👋</h1><p>আমি আল হামরা নূরানী মাদ্রাসার AI সহকারী। আপনি কী জানতে চান?</p>';
  var g=document.createElement("div");g.className="sugs";
  SUGS.forEach(function(s){
    var b=document.createElement("button");b.type="button";b.className="sug";
    b.innerHTML="<span>"+s[0]+"</span><span>"+esc(s[1])+"</span>";
    b.addEventListener("click",function(){
      if(s[0]==="💰"){addUser(s[1]);removeWelcome();showFeeForm()}else send(s[1]);
    });
    g.appendChild(b);
  });
  w.appendChild(g);wrap.appendChild(w);
}
function removeWelcome(){var w=wrap.querySelector(".welcome");if(w)w.remove()}

async function post(path,body){
  var BASE=String((window.ALHAMRA_CHAT||{}).WORKER_URL||"").replace(/\/+$/,"");
  if(!BASE||/YOUR-SUBDOMAIN/.test(BASE))throw new Error("config");
  var ctrl=new AbortController(),t=setTimeout(function(){ctrl.abort()},30000);
  try{
    var res=await fetch(BASE+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:ctrl.signal});
    var data={};try{data=await res.json()}catch(e){}
    return{ok:res.ok,status:res.status,data:data};
  }finally{clearTimeout(t)}
}
function netError(e){
  if(e&&e.message==="config")return"চ্যাটবট এখনো সংযুক্ত হয়নি (chat-config.js-এ Worker-এর ঠিকানা বসানো হয়নি)।";
  if(navigator.onLine===false)return"ইন্টারনেট সংযোগ নেই। সংযোগ চালু করে আবার চেষ্টা করুন।";
  if(e&&e.name==="AbortError")return"উত্তর আসতে বেশি সময় লাগছে। আবার চেষ্টা করুন।";
  return"সংযোগে সমস্যা হয়েছে। একটু পরে আবার চেষ্টা করুন।";
}

async function send(text){
  text=String(text||"").trim();
  if(!text||busy||text.length>1000)return;
  removeWelcome();addUser(text);q.value="";resize();
  busy=true;sendBtn.disabled=true;
  var typing=addTyping();
  try{
    var r=await post("/",{message:text,history:history.slice(-10)});
    typing.remove();
    if(!r.ok){addBot(r.data.error||"AI উত্তর দিতে পারছে না। আবার চেষ্টা করুন।",true)}
    else{
      var ans=r.data.answer||"উত্তর পাওয়া যায়নি।";
      addBot(ans);
      history.push({role:"user",text:text});
      if(r.data.action==="fee_verify"){showFeeForm()}
      else history.push({role:"model",text:ans});
      if(history.length>20)history=history.slice(-20);
    }
  }catch(e){typing.remove();addBot(netError(e),true)}
  busy=false;sendBtn.disabled=false;q.focus();
}

/* ---------- বেতন যাচাই ফরম ---------- */
function showFeeForm(){
  var r=row("bot"),c=document.createElement("div");c.className="card";
  c.innerHTML='<h3>🔐 পরিচয় যাচাই</h3><p class="sub">নিরাপত্তার জন্য শিক্ষার্থীর নিবন্ধিত তথ্য দিন। চারটি তথ্যই মিলতে হবে।</p>'+
   '<label>শ্রেণি</label><select class="f-c"><option value="">শ্রেণি নির্বাচন করুন</option><option>শিশু শ্রেণি</option><option>প্রথম শ্রেণি</option><option>দ্বিতীয় শ্রেণি</option><option>তৃতীয় শ্রেণি</option></select>'+
   '<label>ছাত্রের নাম</label><input class="f-n" type="text" maxlength="100" autocomplete="off" placeholder="নিবন্ধিত নাম">'+
   '<label>পিতার নাম</label><input class="f-f" type="text" maxlength="100" autocomplete="off" placeholder="পিতার নাম">'+
   '<label>নিবন্ধিত মোবাইল নম্বর</label><input class="f-m" type="tel" inputmode="numeric" maxlength="20" autocomplete="off" placeholder="01XXXXXXXXX">'+
   '<button class="btn" type="button">যাচাই করে বেতন দেখুন</button><div class="msg" role="alert"></div>';
  r.appendChild(c);wrap.appendChild(r);scrollDown();
  var btn=c.querySelector(".btn"),msg=c.querySelector(".msg");
  btn.addEventListener("click",async function(){
    var body={className:c.querySelector(".f-c").value,studentName:c.querySelector(".f-n").value.trim(),father:c.querySelector(".f-f").value.trim(),mobile:c.querySelector(".f-m").value.trim()};
    if(!body.className||!body.studentName||!body.father||!body.mobile){msg.textContent="চারটি ঘরই পূরণ করুন।";return}
    msg.textContent="";btn.disabled=true;btn.textContent="যাচাই হচ্ছে...";
    try{
      var res=await post("/verify-fee",body);
      if(res.ok&&res.data.ok){r.remove();showLedger(res.data)}
      else{msg.textContent=res.data.error||"যাচাই করা যায়নি।";btn.disabled=false;btn.textContent="যাচাই করে বেতন দেখুন"}
    }catch(e){msg.textContent=netError(e);btn.disabled=false;btn.textContent="যাচাই করে বেতন দেখুন"}
  });
}
function showLedger(d){
  var r=row("bot"),c=document.createElement("div");c.className="card";
  var rows=d.rows.map(function(x){return"<tr><td>"+esc(x.month)+"</td><td>"+money(x.fee)+"</td><td>"+money(x.paid)+"</td><td>"+money(x.due)+"</td><td class='"+(x.due<=0?"ok":"bad")+"'>"+esc(x.status)+"</td></tr>"}).join("");
  c.innerHTML='<h3>✅ '+esc(d.student.name)+'</h3><p class="sub">'+esc(d.student.className)+' • রোল '+esc(bn(d.student.roll))+' • '+esc(bn(d.year))+' সাল</p>'+
   '<div class="sum"><div><b>'+money(d.totalExpected)+'</b><span>মোট ধার্য</span></div><div class="p"><b>'+money(d.totalPaid)+'</b><span>পরিশোধ</span></div><div class="d"><b>'+money(d.totalDue)+'</b><span>মোট বকেয়া</span></div></div>'+
   '<div class="scroll"><table><thead><tr><th>মাস</th><th>ধার্য</th><th>পরিশোধ</th><th>বাকি</th><th>অবস্থা</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
   '<p class="sub" style="margin-top:8px">গোপনীয়তার জন্য এই তথ্য চ্যাট মুছলে বা পেজ বন্ধ করলে মুছে যাবে।</p>';
  r.appendChild(c);wrap.appendChild(r);scrollDown();
}

/* ---------- নিয়ন্ত্রণ ---------- */
function reset(){history=[];welcome();chat.scrollTop=0;q.focus()}
$("newBtn").addEventListener("click",reset);
$("clearBtn").addEventListener("click",function(){if(!wrap.querySelector(".row")||confirm("পুরো চ্যাট মুছে ফেলবেন?"))reset()});
sendBtn.addEventListener("click",function(){send(q.value)});
q.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send(q.value)}
});
function resize(){q.style.height="auto";q.style.height=Math.min(q.scrollHeight,140)+"px"}
q.addEventListener("input",resize);
$("back").addEventListener("click",function(e){if(document.referrer&&history.length>1&&document.referrer.indexOf(location.origin)===0){e.preventDefault();window.history.back()}});
function net(){$("offline").style.display=navigator.onLine===false?"block":"none"}
window.addEventListener("online",net);window.addEventListener("offline",net);net();
/* মোবাইলে ঠিকানা-বার/কিবোর্ডের কারণে উচ্চতা বদলালে পুরো লেআউট দৃশ্যমান জায়গায় আটকে রাখা */
function fit(){
  var h=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;
  document.documentElement.style.setProperty("--app-h",Math.round(h)+"px");
  window.scrollTo(0,0);scrollDown();
}
if(window.visualViewport){window.visualViewport.addEventListener("resize",fit)}
window.addEventListener("resize",fit);window.addEventListener("orientationchange",fit);
fit();
welcome();
})();
</script>
