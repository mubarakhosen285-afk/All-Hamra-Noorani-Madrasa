<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>পরীক্ষার ফলাফল | আল হামরা নূরানী মাদ্রাসা</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#0f3d2e;--green:#1b5e42;--gold:#c9a227;--paper:#fbf7ee;--line:#d9e3d9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:#183b2d;font-family:'Hind Siliguri',sans-serif}.head{background:linear-gradient(135deg,var(--deep),var(--green));color:#fff;text-align:center;padding:25px 14px;position:relative}.head img{width:66px;height:66px;object-fit:contain}.head h1{font-family:'Noto Serif Bengali';font-size:clamp(1.15rem,4vw,1.65rem);margin:7px 0}.back{position:absolute;left:12px;top:10px;color:#fff;text-decoration:none;display:inline-block;margin:0;padding:5px 9px;border:1px solid #ffffff70;border-radius:7px;font-size:.76rem;line-height:1.2;background:#ffffff12}.wrap{max-width:900px;margin:25px auto;padding:0 14px}.search,.sheet{background:#fff;border:1px solid #e4dfcf;border-radius:18px;padding:22px;box-shadow:0 8px 25px #0f3d2e10}.search h2{text-align:center;color:var(--deep);margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}label{display:block;font-weight:600;margin-bottom:5px}select{width:100%;padding:12px;border:1px solid #cbd5cc;border-radius:9px;font:inherit;background:#fff;color:#183b2d}select:disabled{background:#f1f2ef;color:#888}.btn{border:0;border-radius:9px;padding:11px 20px;background:var(--green);color:#fff;font:600 1rem 'Hind Siliguri';cursor:pointer}.btn[hidden]{display:none!important}.low-mark,.absent-mark{color:#b42318!important;font-weight:700;background:#fff0ee!important}.result-absent{color:#b42318!important}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:17px}.msg{text-align:center;margin-top:12px;color:#876714}.sheet{margin-top:22px;display:none;border:2px solid var(--gold);position:relative}.sheet.show{display:block}.sheet-head{text-align:center;border-bottom:2px double var(--gold);padding-bottom:14px}.sheet-head img{width:55px;height:55px;object-fit:contain}.sheet-head h2{font-family:'Noto Serif Bengali';color:var(--deep);margin:4px 0}.sheet-head h3{margin:3px 0;color:#856817}.sheet-head p{margin:0;color:#617166}.ribbon{text-align:center;font-weight:700;color:var(--deep);background:#f5efdb;border:1px solid #e5d59b;border-radius:8px;padding:7px;margin:14px 0}.student-info{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 18px;padding:12px;background:#f4f8f3;border:1px solid var(--line);border-radius:9px}.student-info div{padding:3px}.student-info b{color:var(--deep)}.tablewrap{overflow-x:auto;margin-top:15px}table{width:100%;border-collapse:collapse;min-width:420px}th,td{border:1px solid #bfcdbf;padding:9px 10px;text-align:center}th{background:#eaf1e9;color:var(--deep)}tbody tr:nth-child(even){background:#fafbf8}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.sum{background:#f4edda;border:1px solid #e8dba9;border-radius:8px;padding:10px;text-align:center}.sum small{display:block;color:#6d715e}.sum b{font-size:1.1rem;color:var(--deep)}.remark{text-align:center;margin:14px 0 0;font-weight:600;color:var(--green)}.foot{text-align:center;border-top:1px dashed #c9b978;margin-top:22px;padding-top:12px;color:#657266;font-size:.88rem}.print-btn{background:#9b7412}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.search,.sheet{padding:15px}.summary{grid-template-columns:repeat(2,1fr)}.student-info{grid-template-columns:1fr 1fr}}@media print{@page{size:A4;margin:12mm}body{background:#fff}.head,.search,.back,.screen-only{display:none!important}.wrap{max-width:none;margin:0;padding:0}.sheet{display:block!important;margin:0;border:2px solid #b99a38;box-shadow:none;padding:18px;break-inside:avoid}.sheet-head h2{font-size:22px}.student-info,th,.sum{print-color-adjust:exact;-webkit-print-color-adjust:exact}table{min-width:0}.foot{margin-top:28px}}
</style>
    <!-- ===== PWA (অ্যাপ হিসেবে ইনস্টল) ===== -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f3d2e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="আল হামরা মাদ্রাসা">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">

    <script src="pwa.js" defer></script>

<script src="nav-restore.js"></script>
</head>
<body>
<header class="head"><img src="madrasa.jpeg" alt="মাদ্রাসার লোগো"><h1>আল হামরা নূরানী মাদ্রাসা, ধানুয়াখালী</h1><div>অনলাইন পরীক্ষার ফলাফল</div><a class="back" href="index.html">←</a></header>
<main class="wrap">
<section class="search screen-only"><h2>📋 পরীক্ষার ফলাফল খুঁজুন</h2><div class="grid">
<div><label for="classSelect">১. শ্রেণি নির্বাচন করুন</label><select id="classSelect"><option value="">শ্রেণি নির্বাচন করুন</option></select></div>
<div><label for="nameSelect">২. শিক্ষার্থীর নাম নির্বাচন করুন</label><select id="nameSelect" disabled><option value="">আগে শ্রেণি নির্বাচন করুন</option></select></div>
<div><label for="examSelect">৩. পরীক্ষার নাম নির্বাচন করুন</label><select id="examSelect" disabled><option value="">আগে শিক্ষার্থী নির্বাচন করুন</option></select></div>
</div><div class="actions"><button class="btn" id="showBtn">ফলাফল দেখুন</button><button class="btn print-btn" id="downloadBtn" disabled hidden>⬇ PDF ডাউনলোড করুন</button></div><div class="msg" id="message">ফলাফল খুঁজতে শ্রেণি, শিক্ষার্থী ও পরীক্ষার নাম নির্বাচন করুন।</div></section>
<article class="sheet" id="markSheet"></article>
</main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';
import{getDatabase,ref,get}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js';
const cfg={apiKey:'AIzaSyCIqSIq3Ci9wODl_OMk5XDMrAK7mVLQvzs',authDomain:'madrasa-admission-system.firebaseapp.com',databaseURL:'https://madrasa-admission-system-default-rtdb.firebaseio.com',projectId:'madrasa-admission-system',storageBucket:'madrasa-admission-system.firebasestorage.app',messagingSenderId:'722552487890',appId:'1:722552487890:web:7a8f6d8deb5da44c11520b'};
const db=getDatabase(initializeApp(cfg));const $=id=>document.getElementById(id);let allResults=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bn=n=>String(n??'—').replace(/[0-9]/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const unique=a=>[...new Set(a.filter(Boolean))];
function setOptions(el,items,placeholder){el.innerHTML=`<option value="">${placeholder}</option>`+items.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');}
async function loadResults(){const msg=$('message');msg.textContent='ফলাফল তালিকা লোড হচ্ছে...';try{const snap=await get(ref(db,'publicResults'));const data=snap.exists()?snap.val():{};allResults=Object.values(data||{}).filter(r=>r&&r.studentName&&r.className&&r.exam);const classes=unique(allResults.map(r=>r.className)).sort((a,b)=>a.localeCompare(b,'bn'));setOptions($('classSelect'),classes,'শ্রেণি নির্বাচন করুন');msg.textContent=allResults.length?'প্রয়োজনীয় তথ্য নির্বাচন করুন।':'এখনো কোনো পরীক্ষার ফলাফল প্রকাশ করা হয়নি।';}catch(e){console.error(e);msg.textContent='ফলাফল লোড করা যায়নি। ইন্টারনেট সংযোগ পরীক্ষা করুন।';}}
$('classSelect').addEventListener('change',()=>{const cls=$('classSelect').value;const names=unique(allResults.filter(r=>r.className===cls).map(r=>r.studentName)).sort((a,b)=>a.localeCompare(b,'bn'));setOptions($('nameSelect'),names,'শিক্ষার্থীর নাম নির্বাচন করুন');$('nameSelect').disabled=!cls;$('examSelect').disabled=true;setOptions($('examSelect'),[],'আগে শিক্ষার্থী নির্বাচন করুন');$('markSheet').classList.remove('show');$('downloadBtn').disabled=true;$('downloadBtn').hidden=true;});
$('nameSelect').addEventListener('change',()=>{const cls=$('classSelect').value,name=$('nameSelect').value;const exams=unique(allResults.filter(r=>r.className===cls&&r.studentName===name).map(r=>JSON.stringify({exam:r.exam,year:r.year??''})));$('examSelect').innerHTML='<option value="">পরীক্ষা নির্বাচন করুন</option>'+exams.map(v=>{const x=JSON.parse(v);return `<option value="${esc(v)}">${esc(x.exam)} — ${bn(x.year)}</option>`}).join('');$('examSelect').disabled=!name;$('markSheet').classList.remove('show');$('downloadBtn').disabled=true;$('downloadBtn').hidden=true;});
$('showBtn').addEventListener('click',()=>{const cls=$('classSelect').value,name=$('nameSelect').value,selected=$('examSelect').value;if(!cls||!name||!selected){$('message').textContent='অনুগ্রহ করে তিনটি ঘর থেকেই তথ্য নির্বাচন করুন।';return;}const ex=JSON.parse(selected);const r=allResults.find(x=>x.className===cls&&x.studentName===name&&x.exam===ex.exam&&String(x.year??'')===String(ex.year));if(!r){$('downloadBtn').disabled=true;$('downloadBtn').hidden=true;$('message').textContent='এই পরীক্ষার ফলাফল পাওয়া যায়নি।';return;}renderMarksheet(r);$('downloadBtn').hidden=false;$('message').textContent='ফলাফল পাওয়া গেছে। নিচের মার্কশিটটি PDF হিসেবে সংরক্ষণ করতে পারবেন।';$('downloadBtn').disabled=false;});
function renderMarksheet(r){
const marks=Array.isArray(r.marks)?r.marks:[];
const isAbsent=m=>m?.absent===true||m?.status==='অনুপস্থিত'||m?.mark===null||m?.mark===undefined||m?.mark==='';
const allAbsent= r.status==='অনুপস্থিত' || (marks.length>0&&marks.every(isAbsent));
const total=allAbsent?0:(Number(r.total)||marks.reduce((sum,m)=>sum+(isAbsent(m)?0:(Number(m.mark)||0)),0));
const full=Number(r.fullMarks)||marks.length*100;
const average=allAbsent?0:(r.average!==undefined&&r.average!==null?Number(r.average):(full?total/(full/100):0));
const overall=allAbsent?'অনুপস্থিত':(r.grade==='F'?'অনুত্তীর্ণ':'উত্তীর্ণ');
const resultClass=allAbsent||r.grade==='F'?'result-absent':'';const advice=(()=>{if(allAbsent)return 'পরামর্শ: পরবর্তী পরীক্ষার আগে নিয়মিত মাদ্রাসায় উপস্থিত হও। অভিভাবকের সঙ্গে কথা বলে প্রতিদিন পড়ার নির্দিষ্ট সময় ঠিক করো।';const weak=marks.filter(m=>!isAbsent(m)&&Number(m.mark)<33).map(m=>m.subject);if(weak.length)return 'পড়াশোনার পরামর্শ: '+weak.join('، ')+' বিষয়ে বেশি মনোযোগ দিবে। প্রতিদিন ২০–৩০ মিনিট করে পড়বে, ভুলগুলো শিক্ষককে দেখাবে এবং সপ্তাহে একবার নিজে পরীক্ষা দিবে।';const middle=marks.filter(m=>!isAbsent(m)&&Number(m.mark)<60).map(m=>m.subject);if(middle.length)return 'পরামর্শ: '+middle.join('، ')+' বিষয়ে নিয়মিত অনুশীলন করো। প্রতিদিন পাঠ পুনরাবৃত্তি ও লিখে উত্তর দেওয়ার অভ্যাস রাখো।';return 'পরামর্শ: আলহামদুলিল্লাহ্‌ খুব ভালো ফলাফল। আরো ভালো করতে প্রতিদিনের পড়া প্রতিদিন শেষ করবে, পাঠগুলো পুনরাবৃত্তি করবে এবং নিয়মিত ছোট পরীক্ষা দিবে।';})();
$('markSheet').innerHTML=`<div class="sheet-head"><img src="madrasa.jpeg" alt="লোগো"><h2>আল হামরা নূরানী মাদ্রাসা</h2><h3>ধানুয়াখালী, জামালগঞ্জ, সুনামগঞ্জ</h3><p>শিক্ষার্থীর একাডেমিক ফলাফল</p></div><div class="ribbon">${esc(r.exam)} পরীক্ষা — ${bn(r.year)} সালের মার্কশিট</div><div class="student-info"><div>শিক্ষার্থীর নাম: <b>${esc(r.studentName)}</b></div><div>শ্রেণি: <b>${esc(r.className)}</b></div><div>রোল নম্বর: <b>${esc(bn(r.roll||'—'))}</b></div><div>মেধাস্থান: <b>${esc(bn(r.position||'—'))}</b></div></div><div class="tablewrap"><table><thead><tr><th>ক্রমিক</th><th>বিষয়ের নাম</th><th>প্রাপ্ত নম্বর</th><th>পূর্ণমান</th></tr></thead><tbody>${marks.map((m,i)=>{const absent=isAbsent(m);const mark=absent?'অনুপস্থিত':bn(m.mark);const low=!absent&&Number(m.mark)<33;return `<tr><td>${bn(i+1)}</td><td>${esc(m.subject)}</td><td class="${absent||low?'low-mark':''}">${mark}</td><td>১০০</td></tr>`}).join('')}</tbody><tfoot><tr><th colspan="2">সর্বমোট</th><th>${bn(total)}</th><th>${bn(full)}</th></tr></tfoot></table></div><div class="summary"><div class="sum"><small>মোট নম্বর</small><b>${bn(total)} / ${bn(full)}</b></div><div class="sum"><small>গড় নম্বর</small><b>${bn(Number(average).toFixed(2))}</b></div><div class="sum"><small>গ্রেড</small><b class="${resultClass}">${esc(allAbsent?'অনুপস্থিত':(r.grade||'—'))}</b></div><div class="sum"><small>ফলাফল</small><b class="${resultClass}">${overall}</b></div></div><p class="remark ${resultClass}">${allAbsent?'এই শিক্ষার্থী পরীক্ষায় অনুপস্থিত ছিল।':advice}</p><div class="foot">এই মার্কশিটটি মাদ্রাসার অনলাইন ফলাফল ব্যবস্থা থেকে তৈরি।<br>আল হামরা নূরানী মাদ্রাসা, ধানুয়াখালী</div>`;
$('markSheet').classList.add('show');
$('markSheet').scrollIntoView({behavior:'smooth',block:'start'});
}
$('downloadBtn').addEventListener('click',()=>{if(!$('markSheet').classList.contains('show'))return;window.print();});
loadResults();
</script></body></html>
